name: Ad hogging safeguard (every 15 min)

# LIVE as of 2026-09-15 -- burn-in reviewed directly (one full day,
# 2026-09-14, across all 5 accounts). The lifetime backstop found the same
# ~27 real dud/no-lead ads on every single check throughout the day with
# identical numbers each time (e.g. RF ad 2091751561375313921: $60.28
# lifetime, ROAS 0.20) -- completely stable, no flip-flopping, high
# confidence the logic is sound. The same-day throttle also correctly
# caught a genuinely worsening case (RF ad 2094290640131645442: $4.26 ->
# $6.84 -> $10.76 spent through the day, zero leads throughout). No false
# positives observed. --execute added below. --verbose-log dropped --
# was only on for burn-in review; see campaign-safeguard.yml's own header
# for why (log-volume/git-collision risk at scale on the Meta side).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      account:
        description: >-
          Account to check, or "all" for every account with adset_ids
          (RF HVAC Siding Bathroom Flooring). Only used for manual runs.
        required: false
        default: "all"
        type: string

permissions:
  contents: write  # needed to commit ad_safeguard_state/*.json and logs/ back to the repo

jobs:
  ad-hogging-safeguard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ad hogging safeguard
        env:
          NEWSBREAK_ACCESS_TOKEN: ${{ secrets.NEWSBREAK_ACCESS_TOKEN }}
          ACCOUNT_SELECTION: ${{ inputs.account || 'all' }}
        run: |
          set +e
          if [ "$ACCOUNT_SELECTION" = "all" ]; then
            accounts="RF HVAC Siding Bathroom Flooring"
          else
            accounts="$ACCOUNT_SELECTION"
          fi
          echo "Running for: $accounts"
          failures=""
          for account in $accounts; do
            echo "::group::${account}"
            # LIVE -- see header comment.
            python .claude/skills/newsbreak-ad-hogging-safeguard/scripts/ad_hogging_safeguard.py "$account" --execute
            if [ $? -ne 0 ]; then
              failures="$failures $account"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failures" ]; then
            echo "FAILED accounts:$failures"
            echo "FAILURES=$failures" >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Commit updated state and logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ad_safeguard_state logs/ad-safeguards
          git add ad_safeguard_state/ logs/ad-safeguards/
          if git diff --staged --quiet; then
            echo "No state/log changes to commit."
          else
            git commit -m "Ad hogging safeguard state/log update"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt $attempt/3) -- pulling and retrying..."
              git pull --rebase origin master
              if [ "$attempt" = "3" ]; then
                echo "::error::Push still failing after 3 attempts."
                exit 1
              fi
            done
          fi

      - name: Fail the run if any account errored
        if: env.FAILURES != ''
        run: |
          echo "One or more accounts failed this run: $FAILURES"
          exit 1
