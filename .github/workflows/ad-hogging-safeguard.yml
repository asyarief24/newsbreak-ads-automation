name: Ad hogging safeguard (every 15 min)

# DRY-RUN BURN-IN as of 2026-09-14 -- ported from meta-ads-automation's
# meta-ad-hogging-safeguard with thresholds re-derived for NewsBreak's own
# real scale (see ad_hogging_safeguard.py's module docstring -- fair share
# here is $0.47-$0.93/ad/day, ~50-100x smaller than Meta's Campaign A).
# Runs WITHOUT --execute deliberately, per explicit user choice -- same
# burn-in discipline as campaign-safeguard.yml. --verbose-log is ON for
# richer review data during burn-in; revisit once flipped to --execute.
#
# Flip to --execute (and drop --verbose-log) only after real dry-run output
# has been reviewed and this workflow's own comment is updated to say so.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      account:
        description: >-
          Account to check, or "all" for every account with adset_ids
          (RF HVAC Siding Bathroom Flooring). Only used for manual runs.
        required: false
        default: "all"
        type: string

permissions:
  contents: write  # needed to commit ad_safeguard_state/*.json and logs/ back to the repo

jobs:
  ad-hogging-safeguard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ad hogging safeguard
        env:
          NEWSBREAK_ACCESS_TOKEN: ${{ secrets.NEWSBREAK_ACCESS_TOKEN }}
          ACCOUNT_SELECTION: ${{ inputs.account || 'all' }}
        run: |
          set +e
          if [ "$ACCOUNT_SELECTION" = "all" ]; then
            accounts="RF HVAC Siding Bathroom Flooring"
          else
            accounts="$ACCOUNT_SELECTION"
          fi
          echo "Running for: $accounts"
          failures=""
          for account in $accounts; do
            echo "::group::${account}"
            # DRY-RUN BURN-IN -- see header comment. Not yet --execute.
            python .claude/skills/newsbreak-ad-hogging-safeguard/scripts/ad_hogging_safeguard.py "$account" --verbose-log
            if [ $? -ne 0 ]; then
              failures="$failures $account"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failures" ]; then
            echo "FAILED accounts:$failures"
            echo "FAILURES=$failures" >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Commit updated state and logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ad_safeguard_state logs/ad-safeguards
          git add ad_safeguard_state/ logs/ad-safeguards/
          if git diff --staged --quiet; then
            echo "No state/log changes to commit."
          else
            git commit -m "Ad hogging safeguard state/log update"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt $attempt/3) -- pulling and retrying..."
              git pull --rebase origin master
              if [ "$attempt" = "3" ]; then
                echo "::error::Push still failing after 3 attempts."
                exit 1
              fi
            done
          fi

      - name: Fail the run if any account errored
        if: env.FAILURES != ''
        run: |
          echo "One or more accounts failed this run: $FAILURES"
          exit 1
