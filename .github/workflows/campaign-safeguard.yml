name: Campaign safeguard (every 30 min)

# LIVE as of 2026-09-15 -- burn-in reviewed directly (one full day,
# 2026-09-14, across all 5 accounts). Real finding: every Layer 1 trip that
# day showed ROAS exactly 0.00 (zero purchases, not just underwater) --
# the same attribution-lag false-positive meta-ad-hogging-safeguard had
# already found and fixed on the Meta side. Fixed here the same way
# (ROAS_THROTTLE_ZERO_PURCHASE_MULTIPLIER -- see campaign_safeguard.py's
# docstring) and re-verified live against real same-day data immediately
# after: RF correctly read healthy once a real purchase landed (ROAS 1.48),
# Flooring correctly held off at $31.61/0 purchases (below the doubled
# bar), while Bathroom ($46.78/0 purchases) and Siding ($41.46/0
# purchases) still correctly tripped -- both had genuinely cleared even
# the doubled bar, a real high-confidence same-day signal. --execute
# added below. --verbose-log dropped at the same time (was only on for
# burn-in review) -- Meta's own experience is that verbose mode causes
# log-volume/git-commit-collision problems at scale, so this goes
# straight to the quieter steady-state logging Meta itself settled on.
on:
  schedule:
    - cron: "0,30 * * * *"
    - cron: "5 0 * * *"  # once-daily backstop shortly after 00:00 UTC (this
                          # project has no per-account timezone lookup, so
                          # everything resets on UTC midnight -- see the
                          # script's own docstring) -- a dedicated daily cron
                          # is less likely to be dropped than relying on the
                          # 30-minute schedule happening to fire right then,
                          # same reasoning as meta-campaign-safeguard's own
                          # second cron entry.
  workflow_dispatch:
    inputs:
      account:
        description: >-
          Account to check, or "all" for every account with a campaign_id
          (RF HVAC Siding Bathroom Flooring). Only used for manual runs.
        required: false
        default: "all"
        type: string

permissions:
  contents: write  # needed to commit campaign_safeguard_state/*.json and logs/ back to the repo

jobs:
  campaign-safeguard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run campaign safeguard
        env:
          NEWSBREAK_ACCESS_TOKEN: ${{ secrets.NEWSBREAK_ACCESS_TOKEN }}
          ACCOUNT_SELECTION: ${{ inputs.account || 'all' }}
        run: |
          set +e
          if [ "$ACCOUNT_SELECTION" = "all" ]; then
            accounts="RF HVAC Siding Bathroom Flooring"
          else
            accounts="$ACCOUNT_SELECTION"
          fi
          echo "Running for: $accounts"
          failures=""
          for account in $accounts; do
            echo "::group::${account}"
            # LIVE -- see header comment.
            python .claude/skills/newsbreak-campaign-safeguard/scripts/campaign_safeguard.py "$account" --execute
            if [ $? -ne 0 ]; then
              failures="$failures $account"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failures" ]; then
            echo "FAILED accounts:$failures"
            echo "FAILURES=$failures" >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Commit updated state and logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p campaign_safeguard_state logs/campaign-safeguards
          git add campaign_safeguard_state/ logs/campaign-safeguards/
          if git diff --staged --quiet; then
            echo "No state/log changes to commit."
          else
            git commit -m "Campaign safeguard state/log update"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt $attempt/3) -- pulling and retrying..."
              git pull --rebase origin master
              if [ "$attempt" = "3" ]; then
                echo "::error::Push still failing after 3 attempts."
                exit 1
              fi
            done
          fi

      - name: Fail the run if any account errored
        if: env.FAILURES != ''
        run: |
          echo "One or more accounts failed this run: $FAILURES"
          exit 1
